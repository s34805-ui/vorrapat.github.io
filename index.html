<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | วรภัทร หลักคำ</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Tahoma", sans-serif;
    min-height: 100vh;

    color: #1e293b;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;

    /* พื้นหลังขาว + ฟ้า/ม่วงอ่อน */
    background:
        radial-gradient(
            circle at 10% 15%,
            #dbeafe 0%,
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 85%,
            #ede9fe 0%,
            transparent 30%
        ),
        #f8fafc;
}


/* ===== กล่องหลัก ===== */

.container {
    width: 100%;
    max-width: 650px;

    background: rgba(255, 255, 255, 0.95);

    padding: 50px 40px;

    border: 1px solid #dbeafe;

    border-radius: 16px;

    text-align: center;

    box-shadow:
        0 12px 35px rgba(37, 99, 235, 0.08);
}


/* ===== หัวข้อเล็ก ===== */

.small-title {
    color: #2563eb;

    font-size: 13px;

    font-weight: 600;

    letter-spacing: 3px;

    margin-bottom: 12px;
}


/* ===== หัวข้อหลัก ===== */

h1 {
    font-size: 40px;

    font-weight: 600;

    margin-bottom: 18px;

    /* ตัวหนังสือไล่สีฟ้า-ม่วง */
    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


/* ===== เส้น ===== */

.line {
    width: 55px;
    height: 3px;

    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );

    margin: 0 auto 25px;

    border-radius: 10px;
}


/* ===== คำอธิบาย ===== */

.subtitle {
    color: #64748b;

    font-size: 16px;

    line-height: 1.8;

    margin-bottom: 28px;
}


/* ===== ชื่อ ===== */

.name {
    font-size: 22px;

    font-weight: 600;

    color: #2563eb;

    margin-bottom: 7px;
}

.school {
    color: #64748b;

    font-size: 15px;

    margin-bottom: 28px;
}


/* ===== ปุ่ม ===== */

.button {
    display: inline-block;

    padding: 11px 25px;

    /* ปุ่มฟ้า-ม่วง */
    background:
        linear-gradient(
            90deg,
            #2563eb,
            #7c3aed
        );

    color: white;

    text-decoration: none;

    border-radius: 8px;

    font-size: 15px;

    font-weight: 500;

    box-shadow:
        0 6px 15px rgba(37, 99, 235, 0.18);

    transition: 0.2s;
}

.button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 9px 20px rgba(37, 99, 235, 0.25);
}


/* ===== Footer ===== */

footer {
    margin-top: 30px;

    color: #94a3b8;

    font-size: 12px;
}


/* ===== มือถือ ===== */

@media (max-width: 600px) {

    body {
        padding: 18px;
    }

    .container {
        padding: 40px 25px;

        border-radius: 14px;
    }

    h1 {
        font-size: 32px;
    }

    .subtitle {
        font-size: 15px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="small-title">
        MY PORTFOLIO
    </div>


    <h1>
        อนาคตของฉัน
    </h1>


    <div class="line"></div>


    <p class="subtitle">
        เว็บไซต์นำเสนอข้อมูลส่วนตัว ผลงาน
        ทักษะ และเป้าหมายในอนาคตของฉัน
    </p>


    <div class="name">
        วรภัทร หลักคำ
    </div>


    <div class="school">
        Portfolio ของฉัน
    </div>


    <a href="portfoilo.html" class="button">
        เข้าสู่ Portfolio →
    </a>


    <footer>
        © 2026 Vorrapat Lakkham
    </footer>


</div>


</body>

</html>
