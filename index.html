<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | วรภัทร หลักคำ</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Tahoma", sans-serif;
    min-height: 100vh;

    background: #f8fafc;
    color: #1e293b;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 25px;
}


/* กล่องหลัก */

.container {
    width: 100%;
    max-width: 650px;

    background: #ffffff;

    padding: 50px 40px;

    border: 1px solid #e2e8f0;
    border-radius: 12px;

    text-align: center;
}


/* หัวข้อเล็ก */

.small-title {
    color: #64748b;

    font-size: 13px;

    letter-spacing: 2px;

    margin-bottom: 12px;
}


/* หัวข้อหลัก */

h1 {
    font-size: 40px;

    font-weight: 600;

    color: #1e293b;

    margin-bottom: 18px;
}


/* เส้น */

.line {
    width: 45px;
    height: 2px;

    background: #3b82f6;

    margin: 0 auto 25px;
}


/* คำอธิบาย */

.subtitle {
    color: #64748b;

    font-size: 16px;

    line-height: 1.8;

    margin-bottom: 28px;
}


/* ชื่อ */

.name {
    font-size: 22px;

    font-weight: 600;

    color: #2563eb;

    margin-bottom: 7px;
}

.school {
    color: #64748b;

    font-size: 15px;

    margin-bottom: 28px;
}


/* ปุ่ม */

.button {
    display: inline-block;

    padding: 11px 24px;

    background: #2563eb;

    color: white;

    text-decoration: none;

    border-radius: 7px;

    font-size: 15px;

    transition: 0.2s;
}

.button:hover {
    background: #1d4ed8;
}


/* Footer */

footer {
    margin-top: 30px;

    color: #94a3b8;

    font-size: 12px;
}


/* มือถือ */

@media (max-width: 600px) {

    body {
        padding: 18px;
    }

    .container {
        padding: 40px 25px;
    }

    h1 {
        font-size: 32px;
    }

    .subtitle {
        font-size: 15px;
    }

}

</style>

</head>


<body>


<div class="container">


    <div class="small-title">
        MY PORTFOLIO
    </div>


    <h1>
        อนาคตของฉัน
    </h1>


    <div class="line"></div>


    <p class="subtitle">
        เว็บไซต์นำเสนอข้อมูลส่วนตัว ผลงาน
        ทักษะ และเป้าหมายในอนาคตของฉัน
    </p>


    <div class="name">
        วรภัทร หลักคำ
    </div>


    <div class="school">
        Portfolio ของฉัน
    </div>


    <a href="portfoilo.html" class="button">
        เข้าสู่ Portfolio →
    </a>


    <footer>
        © 2026 Vorrapat Lakkham
    </footer>


</div>


</body>

</html>
