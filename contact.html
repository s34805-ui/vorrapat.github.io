<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ติดต่อ | วรภัทร หลักคำ</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Tahoma", sans-serif;

    min-height: 100vh;

    background: #f8fafc;

    color: #1e293b;
}


/* ===== NAVBAR ===== */

.navbar {
    height: 70px;

    padding: 0 8%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: #ffffff;

    border-bottom: 1px solid #e2e8f0;
}

.logo {
    font-size: 21px;

    font-weight: 600;

    color: #1e293b;
}

.logo span {
    color: #2563eb;
}

.back {
    color: #475569;

    text-decoration: none;

    padding: 8px 15px;

    border: 1px solid #cbd5e1;

    border-radius: 7px;

    font-size: 14px;

    transition: 0.2s;
}

.back:hover {
    background: #2563eb;

    color: white;

    border-color: #2563eb;
}


/* ===== CONTAINER ===== */

.container {
    width: 88%;

    max-width: 900px;

    margin: 0 auto;

    padding: 60px 0 30px;
}


/* ===== HEADER ===== */

.header {
    text-align: center;

    margin-bottom: 40px;
}

.header small {
    color: #2563eb;

    letter-spacing: 3px;

    font-size: 12px;
}

.header h1 {
    font-size: 42px;

    font-weight: 600;

    color: #1e293b;

    margin: 12px 0;
}

.header p {
    color: #64748b;

    font-size: 16px;
}


/* ===== CONTACT ===== */

.contact-box {
    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 16px;
}


/* ===== CARD ===== */

.card {
    padding: 28px;

    min-height: 190px;

    background: #ffffff;

    border: 1px solid #e2e8f0;

    border-radius: 10px;

    transition: 0.2s;
}

.card:hover {
    transform: translateY(-3px);

    border-color: #93c5fd;

    box-shadow:
        0 8px 20px rgba(15,23,42,0.06);
}

.icon {
    font-size: 32px;

    margin-bottom: 15px;
}

.card h2 {
    color: #1e293b;

    font-size: 20px;

    font-weight: 600;

    margin-bottom: 10px;
}

.card p {
    color: #64748b;

    font-size: 15px;

    line-height: 1.8;
}


/* ===== FOOTER ===== */

footer {
    text-align: center;

    color: #94a3b8;

    font-size: 12px;

    margin: 45px 0 25px;
}


/* ===== MOBILE ===== */

@media (max-width: 700px) {

    .contact-box {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 34px;
    }

    .navbar {
        padding: 0 5%;
    }

    .container {
        padding-top: 45px;
    }

    .card {
        padding: 23px;
    }

}

</style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar">

    <div class="logo">
        VORRAPAT<span>.</span>

    <a href="portfoilo.html" class="back">

        </h1>

        <p>
            ช่องทางสำหรับติดต่อและพูดคุย
        </p>

    </div>



    <!-- CONTACT CARDS -->

    <div class="contact-box">


        <!-- NAME -->

        <div class="card">

            <div class="icon">
                👤
            </div>

            <h2>
                ชื่อ
            </h2>

            <p>
                วรภัทร หลักคำ
            </p>

        </div>



        <!-- EMAIL -->

        <div class="card">

            <div class="icon">
                📧
            </div>

            <h2>
                Email
            </h2>

            <p>
                dearvorrapat@gmail.com
            </p>

        </div>



        <!-- PHONE -->

        <div class="card">

            <div class="icon">
                📱
            </div>

            <h2>
                โทรศัพท์
            </h2>

            <p>
                084XXXXXXX
            </p>

        </div>



        <!-- SCHOOL -->

        <div class="card">

            <div class="icon">
                📍

            <p>
                โรงเรียนบ้านบึง "อุตสาหกรรมนุเคราะห์"
            </p>

        </div>


    </div>


</div>



<footer>

    © 2026 Vorrapat Lakkham • My Portfolio

</footer>


</body>

</html>
