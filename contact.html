body {

    min-height: 100vh;
    color: white;

    background:

.navbar {

.back:hover {
    background: #a855f7;
    color: white;
}

.container {
    width: 90%;
    max-width: 850px;

    margin: 70px auto;
}

.header {
    text-align: center;
    margin-bottom: 45px;
}

.header small {

    margin: 12px 0;

    background:

            90deg,
            #ffffff,
            #c084fc,
            #38bdf8
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.header p {
    color: #94a3b8;
    font-size: 17px;
}

.contact-box {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
}

.card {
    padding: 28px;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.08),
            rgba(255,255,255,0.025)
        );

    border:
        1px solid rgba(255,255,255,0.1);

    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px);

    border-color:
        rgba(168,85,247,0.6);

    box-shadow:
        0 15px 40px rgba(0,0,0,0.4);
}

.icon {
    font-size: 38px;
    margin-bottom: 15px;
}

.card h2 {
    color: #c084fc;
    font-size: 21px;
    margin-bottom: 10px;

.card p {
    color: #cbd5e1;
    line-height: 1.7;
}

footer {
    text-align: center;

    color: #475569;

    font-size: 13px;

    margin: 50px 0;
}

@media (max-width: 700px) {

    .contact-box {
        grid-template-columns: 1fr;
    }

    .header h1 {
        font-size: 38px;
    }
