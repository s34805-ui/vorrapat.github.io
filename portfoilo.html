<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Portfolio | วรภัทร หลักคำ</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Tahoma", sans-serif;
    min-height: 100vh;

    background: #f8fafc;
    color: #1e293b;

    padding-bottom: 40px;
}


/* NAVBAR */

.navbar {
    height: 65px;
    padding: 0 7%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    background: white;

    border-bottom: 1px solid #e2e8f0;
}

.logo {
    font-size: 21px;
    font-weight: 600;
    color: #1e293b;
}

.logo span {
    color: #2563eb;
}

.home {
    color: #475569;
    text-decoration: none;

    padding: 8px 16px;

    border: 1px solid #cbd5e1;
    border-radius: 7px;

    font-size: 14px;

    transition: 0.2s;
}

.home:hover {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}


/* HEADER */

.header {
    text-align: center;

    padding: 55px 20px 35px;
}

.header small {
    color: #64748b;

    letter-spacing: 3px;

    font-size: 13px;
}

.header h1 {
    font-size: 44px;

    font-weight: 600;

    color: #1e293b;

    margin: 10px 0;
}

.header p {
    color: #64748b;

    font-size: 16px;
}


/* PROFILE */

.profile {
    width: 90%;
    max-width: 900px;

    margin: auto;
    padding: 25px;

    display: flex;
    align-items: center;

    gap: 25px;

    background: white;

    border: 1px solid #e2e8f0;
    border-radius: 12px;
}

.profile img {
    width: 95px;
    height: 95px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid #e2e8f0;
}

.profile h2 {
    color: #1e293b;

    font-size: 22px;

    margin-bottom: 7px;
}

.profile p {
    color: #64748b;

    line-height: 1.7;

    font-size: 15px;
}


/* MENU */

.menu {
    width: 90%;
    max-width: 900px;

    margin: 30px auto;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 16px;
}


/* CARD */

.card {
    display: block;

    padding: 24px;

    min-height: 150px;

    text-decoration: none;

    color: #1e293b;

    background: white;

    border: 1px solid #e2e8f0;

    border-radius: 12px;

    transition: 0.2s;
}

.card:hover
